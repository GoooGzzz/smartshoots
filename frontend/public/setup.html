<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SMART SHOOTS · Cloud setup</title><style>body{margin:0;background:#071426;color:#eef5ff;font:16px system-ui;display:grid;min-height:100vh;place-items:center}main{width:min(430px,calc(100% - 64px));padding:30px;border:1px solid #274060;border-radius:28px;background:#102039}h1{font-size:25px}p{line-height:1.7;color:#bfcee2}label{display:block;margin:18px 0 8px}input,button{box-sizing:border-box;width:100%;padding:14px;border-radius:14px;border:1px solid #476386;font:inherit}input{background:#09162a;color:white}button{margin-top:22px;background:#80bcff;color:#071426;font-weight:700;cursor:pointer}a{color:#80bcff}#result{white-space:pre-wrap}</style></head><body><main><h1>SMART SHOOTS</h1><p>Cloud administrator setup<br><span lang="ar" dir="rtl">إنشاء حساب مدير التطبيق على كلاودفلير</span></p><p>Use the BOOTSTRAP_TOKEN secret you set in Cloudflare. This setup works once.</p><form id="setup"><label for="token">Setup token / رمز الإعداد</label><input id="token" type="password" required autocomplete="off"><label for="username">Username / اسم المستخدم</label><input id="username" required autocomplete="username"><label for="password">Password / كلمة المرور (12+)</label><input id="password" type="password" minlength="12" required autocomplete="new-password"><button id="submit">Create admin / إنشاء المدير</button></form><p id="result" role="status"></p><a href="/login">Open app / فتح التطبيق</a></main><script>
document.querySelector('#setup').addEventListener('submit',async e=>{e.preventDefault();const btn=document.querySelector('#submit'),result=document.querySelector('#result');btn.disabled=true;result.textContent='Creating…';try{const r=await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+document.querySelector('#token').value},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});const b=await r.json();if(!r.ok)throw new Error(b.detail||'Setup failed');result.textContent='Admin created. Open the app and sign in. / تم إنشاء المدير. افتح التطبيق وسجل الدخول.';document.querySelector('#setup').reset();}catch(e){result.textContent=e.message;}finally{btn.disabled=false;}});
</script></body></html>
